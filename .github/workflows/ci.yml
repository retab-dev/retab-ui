name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, registry, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # tsc and vitest over this repo exceed the default Node heap on 7GB
      # runners (typecheck died with SIGABRT).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm registry:check
      - run: pnpm vitest run --exclude 'tests/pdf-viewer.test.tsx'
      - run: node --expose-gc ./node_modules/vitest/vitest.mjs run tests/pdf-viewer.test.tsx

  sidebar-motion:
    name: Sidebar motion gates (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Default gate
        run: pnpm verify:file-viewer-sidebar-motion
      - name: Strict renderer-continuity gate
        run: pnpm verify:file-viewer-sidebar-motion:strict
      - name: Simple PDF viewer telemetry gate
        run: pnpm verify:simple-pdf-file-viewer-telemetry
      # The visual gate scores timing-sensitive budgets (main-thread, layout
      # shift) that 2-core CI runners can miss without a product defect.
      # Report-only until budgets are calibrated on CI hardware.
      - name: Visual smoothness gate (report-only)
        run: pnpm verify:file-viewer-sidebar-motion:visual
        continue-on-error: true
      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
