name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, registry, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # tsc and vitest over this repo exceed the default Node heap on 7GB
      # runners (typecheck died with SIGABRT).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm registry:check
      - name: Unit tests
        run: pnpm vitest run --exclude 'tests/pdf-viewer*.test.tsx'
      - name: PDF viewer unit tests
        run: |
          for file in tests/pdf-viewer*.test.tsx; do
            pnpm vitest run "$file" --maxWorkers=1 --minWorkers=1 --testTimeout=15000
          done

  sidebar-motion:
    name: Sidebar motion gates (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove flaky runner apt mirrors
        run: |
          sudo find /etc/apt/sources.list.d -type f \
            \( -name '*azure-cli*' -o -name '*microsoft*' -o -name '*packages-microsoft-prod*' \) \
            -print -delete
      - run: pnpm exec playwright install --with-deps chromium
      - name: Default gate
        run: pnpm verify:file-viewer-sidebar-motion
      - name: Strict renderer-continuity gate
        run: pnpm verify:file-viewer-sidebar-motion:strict
      # Screen-space gate: scores real composited frames over a CDP screencast
      # (whiteout, below-endpoint ink dip, post-motion churn) plus the shell
      # telemetry budgets — the only detector that sees paint-level artifacts
      # DOM sampling cannot. Blocking by design; its budgets are
      # timing-insensitive (main-thread is excluded inside the spec).
      - name: Visual blink pixel gate
        run: pnpm verify:file-viewer-visual-blink
      - name: Sources viewer pixel gate
        run: pnpm verify:sources-viewer-visual-blink
      - name: Simple PDF viewer telemetry gate
        run: pnpm verify:simple-pdf-file-viewer-telemetry
      # Geometry-sweep gate: reading-line trajectory (settle drift, flight
      # corridor, back-and-forth excursion) across viewport heights, scroll
      # depths, and rapid retargets on the sources viewer.
      - name: Sources viewer toggle matrix gate
        run: pnpm verify:sources-viewer-toggle-matrix
        env:
          MOTION_METRICS_PATH: ${{ runner.temp }}/motion-metrics.jsonl
      # Same trajectory scoring over the benchmark page's full format roster
      # (image, tiff, pptx, docx, xlsx, csv, markdown, code, text) at its
      # real scroll ranges.
      - name: Benchmark toggle matrix gate
        run: pnpm verify:benchmark-toggle-matrix
        env:
          MOTION_METRICS_PATH: ${{ runner.temp }}/motion-metrics.jsonl
      # State branches the geometry matrices never enter: overlay mode,
      # inline<->overlay breakpoint crossing, explicit zoom, reduced motion.
      - name: Mode and state matrix gate
        run: pnpm verify:mode-state-matrix
      # Two-writer conflicts (user wheel during the flight) and resource
      # round trips (DOM/canvas populations after toggle cycles).
      - name: Motion conflict and leak gate
        run: pnpm verify:motion-conflict-and-leak
      # Seeded monkey run (fixed seed in CI for determinism; hunt locally
      # with MONKEY_SEED=$RANDOM): random toggles/wheels/zooms/scroll jumps
      # and mid-flight format switches under zero-console-error, document-
      # attached, and bounded-resource invariants.
      - name: Viewer monkey fuzz gate
        run: pnpm verify:viewer-monkey-fuzz
      # Timing-robustness: 4x CPU-throttled settles, cold-start toggles
      # (before document readiness), and an RTL trajectory survey.
      - name: Robustness matrix gate
        run: pnpm verify:robustness-matrix
      # Keyboard input path: Enter/Space toggles must fly the click
      # trajectory, the trigger must keep focus through the toggle it
      # causes, and PageDown mid-flight obeys the same binary contract as
      # the wheel-conflict gate.
      - name: Keyboard and focus gate
        run: pnpm verify:keyboard-focus-matrix
      # Golden-baseline drift check: static budgets catch breakage, this
      # catches creep — any commit that MOVES a motion metric beyond the
      # run-to-run noise band owns that move explicitly (regenerate the
      # baseline with the change if intentional).
      # BLOCKING against a CI-SOURCED baseline: e2e/motion-baseline.json is
      # the motion-metrics artifact of green run 29060862411 — same hardware
      # class as this check, so drift here is a code-caused change, not the
      # local-Mac-vs-runner signature (settleMs ~2x, smaller corridors) that
      # forced the report-only phase. Regenerate from a green run's artifact
      # (gh run download <id> --name motion-metrics), never from a local
      # run, and commit it with the motion change that moved the numbers.
      - name: Motion metric drift check
        run: node scripts/compare-motion-baseline.mjs ${{ runner.temp }}/motion-metrics.jsonl
      # The metrics every matrix gate appended this run; a green run's
      # artifact is the CI-hardware baseline candidate.
      - name: Upload motion metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-metrics
          path: ${{ runner.temp }}/motion-metrics.jsonl
          retention-days: 14
          if-no-files-found: ignore
      # The visual gate scores timing-sensitive budgets (main-thread, layout
      # shift) that 2-core CI runners can miss without a product defect.
      # Report-only until budgets are calibrated on CI hardware.
      - name: Visual smoothness gate (report-only)
        run: pnpm verify:file-viewer-sidebar-motion:visual
        continue-on-error: true
      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
